name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        description: "Name of the microservice"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show service name
        run: |
          echo "Building service: ${{ inputs.service }}"
          echo "Service directory: ./src/${{ inputs.service }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ inputs.service }}
          load: true
          tags: ghcr.io/missnuella/test-repo/${{ inputs.service }}:${{ github.sha }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/missnuella/test-repo/${{ inputs.service }}:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          
      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/missnuella/test-repo/${{ inputs.service }}:${{ github.sha }}
